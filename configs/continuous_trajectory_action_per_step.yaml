base: continuous_dynamics.yaml
experiment: continuous_trajectory
seed: 42
device: cuda
output_dir: /content/drive/MyDrive/ACWM/continuous_trajectory/action_only_per_step
data:
  train_paths: [/content/drive/MyDrive/ACWM/continuous_trajectory_fresh_20261104_190724/avs_target/data/train/episode_*.npz]
  val_paths: [/content/drive/MyDrive/ACWM/continuous_trajectory_fresh_20261104_190724/avs_target/data/val/episode_*.npz]
  test_paths: [/content/drive/MyDrive/ACWM/continuous_trajectory_fresh_20261104_190724/avs_target/data/test/episode_*.npz]
  action_mode: relative
  action_scale: 512.0
  frame_value_range: auto
  batch_size: 64
  num_workers: 2
  cache_episodes: 8
model:
  image_size: 96
  patch_size: 16
  latent_dim: 192
  hidden_dim: 512
  horizon: 16
  integration_steps: 4
  direction_mode: action_only
  direction_scope: per_step
  action_layers: 2
  action_heads: 3
  direction_eps: 0.00000001
loss:
  mode: directional
  weight: 1.0  # Independent of legacy global experiment; adjust here.
  margin: 0.1
  eps: 0.00000001
training:
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.0
  gradient_clip_norm: 1.0
validation:
  interval: 5
  visualization_interval: 5
  samples: 1024
  action_samples: 8
  action_low: -1.0
  action_high: 1.0
  visualization_samples: 512
probe:
  max_train_samples: 10000
  max_eval_samples: 2000
  epochs: 100
  batch_size: 256
  hidden_dim: 128
  learning_rate: 0.001
wandb:
  enabled: true
  project: acwm
  name: continuous_trajectory_action_per_step_seed42
  mode: online
