seed: 42
device: cpu

data:
  train_paths: []
  val_paths: []
  history_length: 3
  batch_size: 256
  num_workers: 2

model:
  version: edge_guided_forward
  model_name: Edge-Guided Forward Model
  # Set this to your trained obs_graph best checkpoint in Colab.
  obs_checkpoint: /content/drive/MyDrive/ACWM/checkpoints/obs_graph_best.pt
  latent_dim: 192
  raw_action_dim: 2
  action_block: 5
  history_size: 3
  hidden_dim: 512
  temporal_layers: 2
  temporal_heads: 3
  temporal_dropout: 0.0
  planning_z_weight: 1.0
  planning_edge_weight: 1.0

training:
  epochs: 100
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.95]
  rollout_length: 5
  checkpoint: outputs/edge_guided_forward/last.pt
  best_checkpoint: outputs/edge_guided_forward/best.pt
  best_planning_checkpoint: outputs/edge_guided_forward/best_planning.pt
  metrics_file: outputs/edge_guided_forward/metrics.jsonl

loss:
  z: 1.0
  edge: 1.0
  terminal: 1.0
  gradient_clip_norm: 1.0

validation:
  planning_interval: 20
  planning_episodes: 50
  planning_videos: 50
  video_dir: outputs/videos/edge_guided_forward

wandb:
  enabled: true
  project: acwm
  entity: null
  name: edge_guided_forward_seed_42
  mode: online

planner:
  horizon: 5
  action_dim: 10
  action_low: -1.0
  action_high: 1.0
  population: 300
  elites: 30
  iterations: 30
  var_scale: 1.0
  clamp_actions: false

environment:
  env_id: swm/PushT-v1
  eval_from_dataset: true
  planning_dataset: train
  goal_offset_steps: 25
  observation_width: 224
  observation_height: 224
  max_steps: 50
  replan_interval: 5
  action_block: 5
  relative_action: true
  warm_start: true
  success_threshold: 0.95
  seed: 1000
  video_fps: 20
  goal_image: null
  goal_reset_state: [50.0, 50.0, 256.0, 256.0, 0.785398]
