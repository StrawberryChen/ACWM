base: continuous_dynamics.yaml
experiment: continuous_trajectory
output_dir: /content/drive/MyDrive/ACWM/continuous_trajectory/action_only
model:
  horizon: 16
  direction_mode: action_only
  action_layers: 2
  action_heads: 3
  direction_eps: 0.00000001
loss:
  weight: 1.0  # Progress weight; try 0.1 for a weaker constraint, or 0 to disable it.
  margin: 0.1  # Minimum velocity projection along the reference direction.
wandb:
  name: continuous_trajectory_action_seed42
validation:
  interval: 5  # Run full validation every N epochs, plus the final epoch.
  visualization_interval: 5  # Save plots on validation epochs that match this cadence.
